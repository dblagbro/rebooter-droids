{% extends "layout.html" %}
{% block title %}Sign In - Rebooter-Droids{% endblock %}
{% block content %}
<section class="auth">
  <h1>Sign in</h1>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="{{ url_for('admin_ui.login_submit') }}">
    <label>Email <input type="email" name="email" value="{{ email or '' }}" required autofocus></label>
    <label>Password <input type="password" name="password" required></label>
    <button type="submit">Sign in</button>
  </form>
</section>
{% endblock %}
