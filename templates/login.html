{% extends "layout.html" %}
{% block title %}Sign In - Rebooter-Droids{% endblock %}
{% block content %}
<section class="auth">
  <h1>Sign in</h1>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="{{ url_for('admin_ui.login_submit') }}">
    <label>Username or email <input type="text" name="email" value="{{ email or '' }}" required autofocus autocomplete="username"></label>
    <label>Password <input type="password" name="password" required></label>
    <button type="submit">Sign in</button>
  </form>
  <p style="margin-top:1rem"><a href="{{ url_for('admin_ui.forgot_password_page') }}">Forgot your password?</a></p>
</section>
{% endblock %}
