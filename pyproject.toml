[project]
name = "rebooter-droids"
version = "0.4.23"
description = "Central coordination server for Sonoff S31-based Rebooter devices"
authors = [{ name = "dblagbro", email = "dblagbro@gmail.com" }]
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "Flask>=3.0,<4",
  "Flask-Login>=0.6.3,<0.7",
  "SQLAlchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.13,<2",
  "gunicorn>=22,<24",
  "pydantic>=2.7,<3",
  "argon2-cffi>=23.1,<24",
  "PyJWT>=2.9,<3",
  "python-ulid>=2.7,<3",
  "APScheduler>=3.10,<4",
  "python-dotenv>=1.0,<2",
  "Flask-Limiter>=3.8,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-flask>=1.3,<2",
  "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.pytest.ini_options]
# Test bucket markers — see docs/testing-split.md.
# `addopts = "-m 'not slow'"` deselects slow probes by default; pass
# `-m ""` (or `-m slow`) to opt in.
markers = [
  "smoke: very fast core-up checks (subset of api)",
  "responsive: mobile/tablet viewport regression tests",
  "slow: tests that block on rate-limit windows or sleep",
]
addopts = "-m 'not slow'"
