# CI-gate nginx — fronts the rebooter-droids app under the /rebooter
# prefix, the shape production runs. Lets `pytest -m ci` exercise the
# nginx-layer behaviour (prefix proxying, firmware static serving with
# autoindex off) for real instead of skipping it against the bare app.
#
# Mounted at /etc/nginx/conf.d/default.conf in the CI nginx container
# (see .github/workflows/ci.yml). The upstream host `rd-ci-app` is the
# app container name on the `rd-ci` Docker network — nginx must start
# after the app so the name resolves.

server {
    listen 80;
    server_name _;

    # Firmware artifacts — served straight off disk from the firmware
    # volume shared with the app container. autoindex off: a request
    # for the directory itself must 403, never list contents.
    location ^~ /rebooter/firmware/ {
        alias /data/firmware/;
        autoindex off;
    }

    # /rebooter with no trailing slash → canonical /rebooter/.
    location = /rebooter {
        return 301 /rebooter/;
    }

    # Everything else under the prefix → the app. The trailing slash on
    # proxy_pass strips /rebooter/ from the path; X-Forwarded-Prefix
    # tells the app's PrefixMiddleware to set SCRIPT_NAME so the URLs it
    # generates (redirects, url_for) carry the prefix back.
    location /rebooter/ {
        proxy_pass http://rd-ci-app:8090/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /rebooter;
        client_max_body_size 25m;  # firmware uploads
    }
}
